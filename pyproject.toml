[tool.taskipy.tasks]
run = "uvicorn app.main:app"
dev = "uvicorn app.main:app --reload"
revision = "alembic revision --autogenerate -m"
migrate = "alembic upgrade head"
test = "pytest"
testusers = "pytest tests/test_users.py"
testauth = "pytest tests/test_auth.py"
testlang = "pytest tests/test_languages.py"
format = "ruff check --fix"
lint = "ruff check"
lintdiff = "ruff check --fix --diff"

[tool.ruff.lint]
ignore=["I001"]
