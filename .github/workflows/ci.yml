name: Backend Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: NGGYU
          POSTGRES_PASSWORD: NGLYD
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install klinvo-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://NGGYU:NGLYD@localhost:5432/test_db
        run: |
          alembic upgrade head
      
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://NGGYU:NGLYD@localhost:5432/test_db
        run: |
          pytest
